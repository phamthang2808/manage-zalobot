    <!-- TikTok Deep-Link Handler -->
    <script>
      (function() {
        const urlParams = new URLSearchParams(window.location.search);
        const tiktokProductId = urlParams.get('open_tiktok_product');
        if (tiktokProductId) {
          // Ép ứng dụng TikTok mở trực tiếp trang sản phẩm (snssdk1180://ec/pdp?product_id=...)
          const appSchemeUrl = "snssdk1180://ec/pdp?product_id=" + tiktokProductId;
          const fallbackUrl = "https://www.tiktok.com/view/product/" + tiktokProductId + "?utm_campaign=client_share&utm_medium=ios&utm_source=copy";
          
          // Thử mở app bằng cách thay đổi window.location
          window.location.href = appSchemeUrl;
          
          // Sau 1.5 giây nếu app không mở (do máy chưa cài, hoặc trình duyệt chặn), tự động redirect sang web chính thức của TikTok
          setTimeout(function() {
            window.location.href = fallbackUrl;
          }, 1500);
        }
      })();
    </script>
